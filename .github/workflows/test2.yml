name: Test Slack Notification
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-deployment:
    runs-on: ubuntu-latest

    steps:

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 🚀 START NOTIFICATION
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Slack Notification - Deployment Started
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            attachments:
              - color: "#4A90D9"
                blocks:
                  - type: header
                    text:
                      type: plain_text
                      text: "🚀  Deployment In Progress"
                      emoji: true
                  - type: divider
                  - type: section
                    fields:
                      - type: mrkdwn
                        text: "*📦 Repository*\n`${{ github.repository }}`"
                      - type: mrkdwn
                        text: "*🌿 Branch*\n`${{ github.ref_name }}`"
                      - type: mrkdwn
                        text: "*👤 Triggered By*\n`${{ github.actor }}`"
                      - type: mrkdwn
                        text: "*🔖 Commit*\n`${{ github.sha }}`"
                  - type: divider
                  - type: context
                    elements:
                      - type: mrkdwn
                        text: "⏱️ *Started at* <!date^${{ github.run_attempt }}^{date_num} {time_secs}|just now>  •  <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|🔗 View Workflow Run>"

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Step 1 - Setup
        run: |
          echo "Setting up environment..."
          sleep 2
        # exit 1

      - name: Step 2 - Build
        run: |
          echo "Building application..."
          sleep 2

      - name: Step 3 - Test
        run: |
          echo "Running tests..."
          sleep 2

      - name: Step 4 - Deploy
        run: |
          echo "Deploying application..."
          echo "Deployment completed successfully!"
          sleep 2

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # ✅ / ❌ RESULT NOTIFICATION
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Slack Notification - Deployment Result
        if: always()
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            attachments:
              - color: "${{ job.status == 'success' && '#2ECC71' || job.status == 'failure' && '#E74C3C' || '#F39C12' }}"
                blocks:
                  - type: header
                    text:
                      type: plain_text
                      text: "${{ job.status == 'success' && '✅  Deployment Successful' || job.status == 'failure' && '❌  Deployment Failed' || '⚠️  Deployment Cancelled' }}"
                      emoji: true
                  - type: divider
                  - type: section
                    fields:
                      - type: mrkdwn
                        text: "*📦 Repository*\n`${{ github.repository }}`"
                      - type: mrkdwn
                        text: "*🌿 Branch*\n`${{ github.ref_name }}`"
                      - type: mrkdwn
                        text: "*👤 Author*\n`${{ github.actor }}`"
                      - type: mrkdwn
                        text: "*🔖 Commit SHA*\n`${{ github.sha }}`"
                  - type: divider
                  - type: section
                    text:
                      type: mrkdwn
                      text: "${{ job.status == 'success' && '🎉 All steps completed without errors. Your changes are now live!' || job.status == 'failure' && '🔍 One or more steps failed. Please review the logs and fix the issue.' || '🛑 The workflow was cancelled before completing.' }}"
                  - type: divider
                  - type: actions
                    elements:
                      - type: button
                        text:
                          type: plain_text
                          text: "🔍 View Logs"
                          emoji: true
                        url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                        style: "${{ job.status == 'success' && 'primary' || 'danger' }}"
                      - type: button
                        text:
                          type: plain_text
                          text: "📂 View Commit"
                          emoji: true
                        url: "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
                  - type: context
                    elements:
                      - type: mrkdwn
                        text: "🤖 Automated by *GitHub Actions*  •  Run *#${{ github.run_number }}*"
